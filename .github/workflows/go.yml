name: Go CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: '1.25'
      - name: Build
        run: |
          cd backend
          go build ./...
      - name: Lint
        run: |
          cd backend
          go vet ./...
      - name: Test
        run: |
          cd backend
          go test -v ./...
