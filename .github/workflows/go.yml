name: Go CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
      - name: Build
        run: |
          cd backend
          go build ./...
      - name: Lint
        run: |
          cd backend
          go vet ./...
      - name: Test
        run: |
          cd backend
          go test -v ./...
