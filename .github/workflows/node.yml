name: Node CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type Check
        run: |
          cd frontend
          npm run typecheck || npm run type-check || echo "No typecheck script"
      - name: Lint
        run: |
          cd frontend
          npm run lint || echo "No lint script"
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Test
        run: |
          cd frontend
          npm test || echo "No test script"
