name: Node CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type Check
        run: |
          cd frontend
          npm run typecheck || npm run type-check || echo "No typecheck script"
      - name: Lint
        run: |
          cd frontend
          npm run lint || echo "No lint script"
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Test
        run: |
          cd frontend
          npm test || echo "No test script"
