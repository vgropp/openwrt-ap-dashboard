name: Node CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type Check
        run: |
          cd frontend
          npm run typecheck || npm run type-check || echo "No typecheck script"
      - name: Lint
        run: |
          cd frontend
          npm run lint || echo "No lint script"
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Test
        run: |
          cd frontend
          npm test || echo "No test script"
