name: Node CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type Check
        run: |
          cd frontend
          npm run typecheck || npm run type-check || echo "No typecheck script"
      - name: Lint
        run: |
          cd frontend
          npm run lint || echo "No lint script"
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Test
        run: |
          cd frontend
          npm test || echo "No test script"
